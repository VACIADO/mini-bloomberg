<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Bloomberg - EUR/USD Terminal Profesional</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38ef7d; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8a9ba8; margin-bottom: 15px; font-size: 14px; }
        .market-status { text-align: center; margin-bottom: 20px; }
        .badge-closed { background: #f23645; color: white; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .dashboard { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .sidebar { width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: #131722; border: 1px solid #2a2e39; border-radius: 8px; padding: 15px; }
        .panel h3 { margin-top: 0; color: #d1d4dc; font-size: 16px; border-bottom: 1px solid #2a2e39; padding-bottom: 8px; }
        .asset-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .asset-name { color: #8a9ba8; }
        .asset-price { font-weight: bold; color: #fff; }
        .pos { color: #089981; }
        .neg { color: #f23645; }
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .fuerza-bar-container { background: #131722; padding: 15px; border-radius: 8px; border: 1px solid #2a2e39; }
        .bar-wrapper { display: flex; height: 25px; border-radius: 4px; overflow: hidden; margin-top: 10px; background: #2a2e39; }
        .bar-euro { background: #2962FF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; transition: width 0.5s ease-in-out; }
        .bar-dolar { background: #FF6D00; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; transition: width 0.5s ease-in-out; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; background: #131722; padding: 10px 15px; border-top-left-radius: 8px; border-top-right-radius: 8px; border: 1px solid #2a2e39; border-bottom: none; }
        .timeframes { display: flex; gap: 4px; background: #0b0e14; padding: 3px; border-radius: 6px; border: 1px solid #2a2e39; }
        .tf-btn { background: transparent; border: 1px solid transparent; color: #8a9ba8; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: all 0.2s ease; }
        .tf-btn:hover { color: #ffffff; background: rgba(41, 98, 255, 0.15); }
        .tf-btn.active { background: #2962FF; color: white; border-color: #2962FF; }
        #chart-container { width: 100%; height: 450px; background: #131722; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; border: 1px solid #2a2e39; }
    </style>
</head>
<body>

    <h1>TERMINAL MINI BLOOMBERG</h1>
    <div class="subtitle">Análisis de Correlación y Flujos EUR/USD</div>
    <div class="market-status">
        <span class="badge-closed">Sistema en Vivo (WebSockets)</span>
    </div>

    <div class="dashboard">
        <div class="sidebar">
            <div class="panel">
                <h3>Bando EUR (5 Activos)</h3>
                <div id="lista-euro">Cargando datos...</div>
            </div>
            <div class="panel">
                <h3>Bando USD (5 Activos)</h3>
                <div id="lista-dolar">Cargando datos...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="fuerza-bar-container">
                <h3>Balanza de Fuerza Institucional</h3>
                <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px;">
                    <span id="txt-euro">EUR: 50%</span>
                    <span id="txt-neta" style="color: #38ef7d; font-weight: bold;">Fuerza Neta: 0.0</span>
                    <span id="txt-dolar">USD: 50%</span>
                </div>
                <div class="bar-wrapper">
                    <div id="bar-euro" class="bar-euro" style="width: 50%;">EUR 50%</div>
                    <div id="bar-dolar" class="bar-dolar" style="width: 50%;">USD 50%</div>
                </div>
            </div>

            <div>
                <div class="chart-header">
                    <span style="font-size: 14px; font-weight: bold; color: #d1d4dc;">Gráfico Sintético EUR/USD</span>
                    <div class="timeframes">
                        <button class="tf-btn active" onclick="cambiarTF('M5', this)">M5</button>
                        <button class="tf-btn" onclick="cambiarTF('M15', this)">M15</button>
                        <button class="tf-btn" onclick="cambiarTF('M30', this)">M30</button>
                        <button class="tf-btn" onclick="cambiarTF('H1', this)">H1</button>
                        <button class="tf-btn" onclick="cambiarTF('H4', this)">H4</button>
                        <button class="tf-btn" onclick="cambiarTF('D1', this)">D1</button>
                    </div>
                </div>
                <div id="chart-container"></div>
            </div>
        </div>
    </div>

    <script>
        const nombresAmigables = {
            "EUR_USD": "EUR/USD", "EUR_JPY": "EUR/JPY", "EUR_GBP": "EUR/GBP", "GOLD": "Oro", "BUND": "Bund Alemán",
            "DXY": "DXY (Dólar)", "US10Y": "Treasury 10Y", "SP500": "S&P 500", "NASDAQ": "Nasdaq", "WTI": "Petróleo WTI"
        };

        let chart = null;
        let candleSeries = null;

        function inicializarGrafico() {
            const container = document.getElementById('chart-container');
            container.innerHTML = ''; // Limpiar contenedor por completo

            chart = LightweightCharts.createChart(container, {
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
                timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
                rightPriceScale: { visible: true, borderColor: '#2a2e39', autoScale: true }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#089981', 
                downColor: '#f23645', 
                borderVisible: false, 
                wickUpColor: '#089981', 
                wickDownColor: '#f23645',
                priceFormat: { type: 'price', precision: 5, minMove: 0.00001 },
            });
        }

        inicializarGrafico();

        function cambiarTF(tf, elemento) {
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            
            inicializarGrafico(); // Destruye y recrea el gráfico limpio para la nueva escala

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ accion: "cambiar_tf", timeframe: tf }));
            }
        }

        const ws = new WebSocket('ws://localhost:8765');
        let primeraCarga = true;

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.velas && data.velas.length > 0) {
                candleSeries.setData(data.velas);
                if (primeraCarga) {
                    chart.timeScale().fitContent();
                    primeraCarga = false;
                }
            }

            if (data.porcentajeEuro !== undefined) {
                document.getElementById('txt-euro').innerText = `EUR: ${data.porcentajeEuro}%`;
                document.getElementById('txt-dolar').innerText = `USD: ${data.porcentajeDolar}%`;
                document.getElementById('txt-neta').innerText = `Fuerza Neta: ${data.fuerzaNeta}`;
                document.getElementById('bar-euro').style.width = data.porcentajeEuro + '%';
                document.getElementById('bar-euro').innerText = data.porcentajeEuro > 10 ? `EUR ${data.porcentajeEuro}%` : '';
                document.getElementById('bar-dolar').style.width = data.porcentajeDolar + '%';
                document.getElementById('bar-dolar').innerText = data.porcentajeDolar > 10 ? `USD ${data.porcentajeDolar}%` : '';
            }

            if (data.euro) {
                let htmlEuro = '';
                for (let key in data.euro) {
                    let item = data.euro[key];
                    let cls = item.var >= 0 ? 'pos' : 'neg';
                    let nombreMostrar = nombresAmigables[key] || key;
                    htmlEuro += `<div class="asset-item"><span class="asset-name">${nombreMostrar}</span><span class="asset-price">${item.precio} <span class="${cls}">(${item.var}%)</span></span></div>`;
                }
                document.getElementById('lista-euro').innerHTML = htmlEuro;
            }

            if (data.dolar) {
                let htmlDolar = '';
                for (let key in data.dolar) {
                    let item = data.dolar[key];
                    let cls = item.var >= 0 ? 'pos' : 'neg';
                    let nombreMostrar = nombresAmigables[key] || key;
                    htmlDolar += `<div class="asset-item"><span class="asset-name">${nombreMostrar}</span><span class="asset-price">${item.precio} <span class="${cls}">(${item.var}%)</span></span></div>`;
                }
                document.getElementById('lista-dolar').innerHTML = htmlDolar;
            }
        };

        ws.onopen = function() {
            console.log("Conectado al servidor Mini Bloomberg.");
        };
    </script>
</body>
</html>
