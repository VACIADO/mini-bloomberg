<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal Bloomberg Pro v9.0</title>
    <style>
        :root { --bg-main: #070a0f; --bg-surface: #111520; --bg-input: #0b0e14; --accent-amber: #f59e0b; --text-primary: #f8fafc; --text-secondary: #94a3b8; --border-color: #232b3b; }
        body { font-family: sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 14px; }
        .master-bar { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; margin-bottom: 14px; }
        .cfd-panel { background: var(--bg-surface); padding: 14px; border-radius: 6px; height: 500px; display: flex; flex-direction: column; }
        #cfd-container { flex: 1; background: var(--bg-input); border: 1px solid var(--border-color); position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        .battle-bar-container { background: var(--bg-input); padding: 10px; border-radius: 5px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .battle-progress-bg { flex: 1; height: 10px; background: #f43f5e; border-radius: 5px; overflow: hidden; }
        .battle-progress-fill { height: 100%; background: #22c55e; width: 50%; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="master-bar">⚡ TERMINAL BLOOMBERG PRO v9.0</div>

<div class="cfd-panel">
    <h2 id="cfd-title">GRAPH CFD: EUR/USD</h2>
    <div class="battle-bar-container">
        <span>EUR</span>
        <div class="battle-progress-bg"><div id="battle-fill" class="battle-progress-fill"></div></div>
        <span>USD</span>
        <span id="battle-score">50% / 50%</span>
    </div>
    <div id="cfd-container">
        <canvas id="cfd-canvas"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('cfd-canvas');
    const ctx = canvas.getContext('2d');
    let cfdData = [];
    let currentPrice = 1.15300;

    // 1. CONEXIÓN AL SERVIDOR FLASK
    async function updateCFD() {
        try {
            // Petición al servidor (debe estar corriendo en puerto 5000)
            const response = await fetch('http://127.0.0.1:5000/precio');
            const data = await response.json();
            
            const nuevoPrecio = parseFloat(data.cfd);
            
            // Crear nueva vela
            const ultimaVela = cfdData.length > 0 ? cfdData[cfdData.length - 1] : { close: nuevoPrecio };
            const nuevaVela = {
                open: ultimaVela.close,
                high: Math.max(ultimaVela.close, nuevoPrecio),
                low: Math.min(ultimaVela.close, nuevoPrecio),
                close: nuevoPrecio,
                time: new Date()
            };

            cfdData.push(nuevaVela);
            if (cfdData.length > 50) cfdData.shift();
            
            // Actualizar interfaz
            drawCFD();
            updateBattleBar();
            
        } catch (e) {
            console.error("Servidor no detectado. Revisa que Flask esté corriendo.");
        }
    }

    // 2. DIBUJO DEL CANVAS
    function drawCFD() {
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        
        if (cfdData.length < 2) return;

        const padding = 40;
        const prices = cfdData.map(v => v.high).concat(cfdData.map(v => v.low));
        const max = Math.max(...prices);
        const min = Math.min(...prices);
        
        ctx.strokeStyle = '#22c55e';
        ctx.beginPath();
        cfdData.forEach((v, i) => {
            const x = (i / (cfdData.length - 1)) * (w - padding);
            const y = h - ((v.close - min) / (max - min) * (h - padding)) - padding/2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    // 3. BARRA DE PELEA
    function updateBattleBar() {
        const fill = document.getElementById('battle-fill');
        const score = document.getElementById('battle-score');
        // Simulación basada en movimiento
        const p = 50 + (Math.random() * 20 - 10); 
        fill.style.width = p + "%";
        score.innerText = `${p.toFixed(0)}% / ${(100-p).toFixed(0)}%`;
    }

    // INICIAR
    setInterval(updateCFD, 1000);
</script>
</body>
</html>
