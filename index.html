<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Pro Terminal – Real Fractal CFD & TradingView Engine</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#0b0e14; color:#fff; display:flex; flex-wrap:wrap; gap:10px; padding:10px; justify-content:center;}
  .panel { border:1px solid #2a2e39; border-radius:8px; background:#131722; padding:10px; flex:1 1 45%; min-width:320px; display:flex; flex-direction:column; height:460px;}
  h2 { margin:0 0 8px 0; text-align:center; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; color: #f59e0b; }
  .text-euro { color: #3b82f6; }
  .text-dolar { color: #ef4444; }
  .tradingview-widget-container { flex:1; margin-top:3px; border-radius:4px; overflow:hidden; min-height: 60px; }
  
  .header-cfd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .timeframe-select, .btn-macro { background: #1e222d; color: #f59e0b; border: 1px solid #2a2e39; border-radius: 4px; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
  .btn-macro:hover { background: #2a2e39; color: #fff; }
  .btn-nfp { color: #ef4444; border-color: #ef4444; }
  .btn-bce { color: #3b82f6; border-color: #3b82f6; }

  #cfd-container { flex:1; border:1px solid #2a2e39; border-radius:6px; position:relative; background:#05070a; overflow:hidden; cursor: grab; }
  #cfd-container:active { cursor: grabbing; }
  #cfd-canvas { width:100%; height:100%; display:block; }
  
  #ia-news-container { display:flex; gap:10px; height:160px; margin-top:8px; }
  #ia-console { flex:1.3; background:#05070a; color:#00ff66; font-family:'Courier New', Courier, monospace; padding:8px; overflow-y:auto; font-size:0.75rem; border-radius:4px; border:1px solid #2a2e39; line-height: 1.4; }
  .news-panel { flex:1; background:#131722; padding:8px; border-radius:4px; border:1px solid #2a2e39; display:flex; flex-direction:column; }
  .news-panel h3 { margin:0 0 5px 0; font-size:11px; color:#8f9cae; text-transform:uppercase; display:flex; justify-content:space-between; }
  
  .input-group { display:flex; gap:6px; margin-top:auto; }
  input[type="text"] { flex:1; padding:8px; border-radius:4px; border:1px solid #2a2e39; background:#1e222d; color:#fff; font-size:0.8rem; outline:none; }
  input[type="text"]:focus { border-color: #f59e0b; }
  button.btn-send { padding:8px 14px; border-radius:4px; border:none; background:#f59e0b; color:#000; font-weight:bold; cursor:pointer; font-size:0.8rem; transition: background 0.2s; }
  button.btn-send:hover { background:#d97706; }
  
  #alertBox { position:absolute; top:10px; right:75px; z-index:10; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .alert { padding:8px 12px; font-size:0.75rem; font-weight:bold; border-radius:4px; box-shadow:0 4px 6px rgba(0,0,0,0.6); animation: fadeIn 0.3s forwards; }
  .alert-buy { background:#16a34a; color:#fff; border-left:4px solid #4ade80; }
  .alert-sell { background:#dc2626; color:#fff; border-left:4px solid #f87171; }
  .alert-info { background:#2563eb; color:#fff; border-left:4px solid #60a5fa; }
  
  @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- PANEL EQUIPO EURO -->
<div class="panel">
  <h2 class="text-euro">🇪🇺 Bloque Euro (Fuerza Eurozona)</h2>
  <div class="tradingview-widget-container" id="tv_exy"></div>
  <div class="tradingview-widget-container" id="tv_eurodolar"></div>
  <div class="tradingview-widget-container" id="tv_bono_eu"></div>
  <div class="tradingview-widget-container" id="tv_eurjpy"></div>
  <div class="tradingview-widget-container" id="tv_dax"></div>
</div>

<!-- PANEL EQUIPO DÓLAR -->
<div class="panel">
  <h2 class="text-dolar">🇺🇸 Bloque Dólar (Fuerza USD / Inflación)</h2>
  <div class="tradingview-widget-container" id="tv_dxy"></div>
  <div class="tradingview-widget-container" id="tv_bono_us"></div>
  <div class="tradingview-widget-container" id="tv_brent"></div>
  <div class="tradingview-widget-container" id="tv_sp500"></div>
  <div class="tradingview-widget-container" id="tv_vix"></div>
</div>

<!-- PANEL CFD SINTÉTICO FRACTAL -->
<div class="panel" style="flex:1 1 95%; height: 560px;">
  <div class="header-cfd">
    <h2>⚡ BLOOMBERG PRO CFD ENGINE (REAL FRACTAL & TRADINGVIEW SCALE)</h2>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn-macro" onclick="window.resetVistaCFD()">🔄 Reset Vista</button>
      <button class="btn-macro btn-nfp" onclick="window.inyectarNoticia('NFP')">💥 Shock NFP US</button>
      <button class="btn-macro btn-bce" onclick="window.inyectarNoticia('BCE')">🏛️ Shock Tasas BCE</button>
      <select id="tf-select" class="timeframe-select" onchange="window.cambiarTimeframe(this.value)">
        <option value="1">Fractal M1 (1 sec/vela)</option>
        <option value="5" selected>Fractal M5 (5 sec/vela)</option>
        <option value="15">Fractal M15 (15 sec/vela)</option>
        <option value="60">Fractal H1 (1 min/vela)</option>
      </select>
    </div>
  </div>
  
  <div id="cfd-container">
    <div id="alertBox"></div>
    <canvas id="cfd-canvas"></canvas>
  </div>
  
  <div id="ia-news-container">
    <div id="ia-console"></div>
    <div class="news-panel">
      <h3>
        <span>Copilot IA Smart Filter</span>
        <span id="risk-display" style="color:#f59e0b;">Target: +25 Pips</span>
      </h3>
      <p style="font-size:0.75rem; color:#8f9cae; margin:0 0 8px 0;">Cambia de fractal temporal para ver velas agrupadas y patrones estructurales.</p>
      <div class="input-group">
        <input type="text" id="chat-input" placeholder="Ej: ¿Qué fractal uso?, RSI, soporte, resistencia..." onkeypress="if(event.key==='Enter') window.sendMessage()">
        <button class="btn-send" onclick="window.sendMessage()">Analizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. WIDGETS TRADINGVIEW
  function crearWidget(containerId, symbol){
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    if (typeof TradingView !== 'undefined') {
      new TradingView.widget({
        container_id: containerId, symbol: symbol, interval: "15",
        timezone: "Europe/Madrid", theme: "dark", style: "1", locale: "es",
        hide_top_toolbar: true, hide_legend: true, width: "100%", height: "100%"
      });
    }
  }

  const widgets = {
    tv_exy: "FX_IDC:EURUSD", tv_eurodolar: "FX:EURUSD", tv_bono_eu: "TVC:DE10Y", 
    tv_eurjpy: "FX:EURJPY", tv_dax: "CAPITALCOM:DE40", tv_dxy: "CAPITALCOM:DXY", 
    tv_bono_us: "TVC:US10Y", tv_brent: "TVC:UKOIL", tv_sp500: "FOREXCOM:SPXUSD", tv_vix: "TVC:VIX"
  };
  for(const id in widgets) crearWidget(id, widgets[id]);

  // 2. MOTOR TICKS BASE & MULTI-FRACTALIDAD REAL
  let rawTicks = [];         // Historial continuo de precios
  let aggregatedCandles = []; // Velas del timeframe activo
  let lastPrice = 1.08500;
  let timeframeFactor = 5;    // Ticks por vela según la selección (M1=1, M5=5, M15=15, H1=60)
  let updateInterval = null;
  let shockVolatilidad = 0;

  // Variables de Zoom y Movimiento
  let visibleCandles = 40;
  let viewOffset = 0;
  let isDragging = false;
  let startX = 0;

  const container = document.getElementById("cfd-container");
  const canvas = document.getElementById("cfd-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){ 
    canvas.width = container.clientWidth; 
    canvas.height = container.clientHeight; 
  }
  window.addEventListener("resize", () => { resizeCanvas(); drawCFD(); });
  resizeCanvas();

  // 3. GENERADOR DE TICKS Y CONSTRUCTOR DE VELAS FRACTALES
  function generarNuevoTick() {
    let delta = (Math.random() - 0.495) * 0.00025;
    if (shockVolatilidad !== 0) {
      delta += shockVolatilidad * 0.0012;
      shockVolatilidad *= 0.65;
      if (Math.abs(shockVolatilidad) < 0.00005) shockVolatilidad = 0;
    }
    lastPrice += delta;
    rawTicks.push(lastPrice);
    if (rawTicks.length > 3000) rawTicks.shift();
  }

  function reconstruirVelasFractales() {
    aggregatedCandles = [];
    const factor = timeframeFactor;
    
    for (let i = 0; i < rawTicks.length; i += factor) {
      const slice = rawTicks.slice(i, i + factor);
      if (slice.length === 0) continue;

      const open = slice[0];
      const close = slice[slice.length - 1];
      const high = Math.max(...slice) + (Math.random() * 0.00005);
      const low = Math.min(...slice) - (Math.random() * 0.00005);

      aggregatedCandles.push({ open, high, low, close });
    }

    // Calcular Indicadores Técnicos en el nuevo Fractal
    calcularIndicadoresTecnicos();
  }

  // 4. INDICADORES TÉCNICOS POR FRACTAL
  function ta_sma(data, length) {
    if (data.length < length) return null;
    return data.slice(-length).reduce((acc, val) => acc + val.close, 0) / length;
  }

  function ta_rsi(data, length = 14) {
    if (data.length < length + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = data.length - length; i < data.length; i++) {
      const diff = data[i].close - data[i - 1].close;
      if (diff >= 0) gains += diff; else losses -= diff;
    }
    const avgGain = gains / length, avgLoss = losses / length;
    if (avgLoss === 0) return 100;
    return 100 - (100 / (1 + (avgGain / avgLoss)));
  }

  function ta_bollinger(data, length = 20, mult = 2) {
    const sma = ta_sma(data, length);
    if (!sma) return null;
    const slice = data.slice(-length);
    const variance = slice.reduce((acc, val) => acc + Math.pow(val.close - sma, 2), 0) / length;
    const stdDev = Math.sqrt(variance);
    return { upper: sma + (stdDev * mult), lower: sma - (stdDev * mult), middle: sma };
  }

  function calcularIndicadoresTecnicos() {
    for (let i = 0; i < aggregatedCandles.length; i++) {
      const subArr = aggregatedCandles.slice(0, i + 1);
      aggregatedCandles[i].shortMA = ta_sma(subArr, 20);
      aggregatedCandles[i].longMA = ta_sma(subArr, 50);
      aggregatedCandles[i].rsi = ta_rsi(subArr, 14);
      aggregatedCandles[i].bb = ta_bollinger(subArr, 20, 2);

      if (i > 1 && !aggregatedCandles[i].signal) {
        const prevShort = aggregatedCandles[i-1].shortMA;
        const prevLong = aggregatedCandles[i-1].longMA;
        const currShort = aggregatedCandles[i].shortMA;
        const currLong = aggregatedCandles[i].longMA;

        if (prevShort && prevLong && prevShort <= prevLong && currShort > currLong) {
          aggregatedCandles[i].signal = { type: "BUY" };
          if (i === aggregatedCandles.length - 1) {
            showAlert(`COMPRA IA (${getTimeframeLabel()}) @ ${aggregatedCandles[i].close.toFixed(5)}`, "alert-buy");
            logConsole("SMART IA ENGINE", `🚀 SEÑAL BUY FRACTAL ${getTimeframeLabel()} @ ${aggregatedCandles[i].close.toFixed(5)}`);
          }
        } else if (prevShort && prevLong && prevShort >= prevLong && currLong > currShort) {
          aggregatedCandles[i].signal = { type: "SELL" };
          if (i === aggregatedCandles.length - 1) {
            showAlert(`VENTA IA (${getTimeframeLabel()}) @ ${aggregatedCandles[i].close.toFixed(5)}`, "alert-sell");
            logConsole("SMART IA ENGINE", `🪂 SEÑAL SELL FRACTAL ${getTimeframeLabel()} @ ${aggregatedCandles[i].close.toFixed(5)}`);
          }
        }
      }
    }
  }

  function getTimeframeLabel() {
    if (timeframeFactor === 1) return "M1";
    if (timeframeFactor === 5) return "M5";
    if (timeframeFactor === 15) return "M15";
    return "H1";
  }

  // 5. EVENTOS INTERACTIVOS (ZOOM & PAN)
  container.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.deltaY < 0) {
      visibleCandles = Math.max(10, visibleCandles - 3);
    } else {
      visibleCandles = Math.min(150, visibleCandles + 3);
    }
    drawCFD();
  }, { passive: false });

  container.addEventListener("mousedown", (e) => { isDragging = true; startX = e.clientX; });
  window.addEventListener("mouseup", () => { isDragging = false; });

  container.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - startX;
    if (Math.abs(deltaX) > 4) {
      const sensitivity = visibleCandles / canvas.width;
      const moveAmount = Math.round(deltaX * sensitivity);
      if (moveAmount !== 0) {
        viewOffset = Math.max(0, Math.min(aggregatedCandles.length - visibleCandles, viewOffset + moveAmount));
        startX = e.clientX;
        drawCFD();
      }
    }
  });

  window.resetVistaCFD = function() {
    viewOffset = 0;
    visibleCandles = 40;
    drawCFD();
    logConsole("SISTEMA", "Vista centrada en la última vela del fractal.");
  };

  // 6. RENDERIZADO GRÁFICO TIPO TRADINGVIEW
  function drawCFD(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(aggregatedCandles.length === 0) return;

    const paddingLeft = 10;
    const paddingRight = 75;
    const paddingTop = 25;
    const rsiHeight = 65;
    const mainHeight = canvas.height - paddingTop - rsiHeight - 30;
    const width = canvas.width - paddingLeft - paddingRight;

    const endIndex = Math.max(0, aggregatedCandles.length - viewOffset);
    const startIndex = Math.max(0, endIndex - visibleCandles);
    const visibleData = aggregatedCandles.slice(startIndex, endIndex);

    if (visibleData.length === 0) return;

    const max = Math.max(...visibleData.map(v => v.high)) + 0.00015;
    const min = Math.min(...visibleData.map(v => v.low)) - 0.00015;

    const getX = (i) => paddingLeft + (i / (visibleData.length - 1 || 1)) * width;
    const getY = (val) => paddingTop + (max - val) / Math.max(0.00001, (max - min)) * mainHeight;

    // A. REJILLA & EJE DE PRECIOS VISIBLE REAL
    ctx.strokeStyle = "#1e222d"; ctx.lineWidth = 1; ctx.fillStyle = "#8f9cae"; ctx.font = "10px monospace";
    for (let i = 0; i <= 5; i++) {
      const priceVal = min + (i / 5) * (max - min);
      const yPos = getY(priceVal);
      ctx.beginPath(); ctx.setLineDash([3, 3]); ctx.moveTo(paddingLeft, yPos); ctx.lineTo(canvas.width - paddingRight, yPos); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillText(priceVal.toFixed(5), canvas.width - paddingRight + 8, yPos + 3);
    }

    // B. BANDA DE BOLLINGER
    ctx.fillStyle = "rgba(245, 158, 11, 0.05)"; ctx.beginPath();
    let firstBB = true;
    visibleData.forEach((v, i) => {
      if (v.bb) {
        const x = getX(i), yUpper = getY(v.bb.upper);
        if (firstBB) { ctx.moveTo(x, yUpper); firstBB = false; } else ctx.lineTo(x, yUpper);
      }
    });
    for (let i = visibleData.length - 1; i >= 0; i--) {
      if (visibleData[i].bb) ctx.lineTo(getX(i), getY(visibleData[i].bb.lower));
    }
    ctx.closePath(); ctx.fill();

    // C. VELAS JAPONESAS FRACTALES
    const candleWidth = Math.max(2, (width / visibleData.length) - 3);
    visibleData.forEach((v, i) => {
      const x = getX(i), yOpen = getY(v.open), yClose = getY(v.close), yHigh = getY(v.high), yLow = getY(v.low);
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();
      ctx.fillStyle = (v.close >= v.open) ? "#22c55e" : "#ef4444";
      ctx.fillRect(x - candleWidth/2, Math.min(yOpen, yClose), candleWidth, Math.max(2, Math.abs(yClose - yOpen)));

      if (v.signal) {
        ctx.fillStyle = v.signal.type === "BUY" ? "#22c55e" : "#ef4444";
        ctx.font = "bold 10px sans-serif";
        ctx.fillText(v.signal.type === "BUY" ? "🚀 BUY" : "🪂 SELL", x - 15, v.signal.type === "BUY" ? yLow + 16 : yHigh - 8);
      }
    });

    // D. MEDIAS MÓVILES (FRACTALES)
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = 2; ctx.beginPath();
    let f20 = true;
    visibleData.forEach((v, i) => {
      if (v.shortMA) { const x = getX(i), y = getY(v.shortMA); if (f20) { ctx.moveTo(x, y); f20 = false; } else ctx.lineTo(x, y); }
    });
    ctx.stroke();

    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2; ctx.beginPath();
    let f50 = true;
    visibleData.forEach((v, i) => {
      if (v.longMA) { const x = getX(i), y = getY(v.longMA); if (f50) { ctx.moveTo(x, y); f50 = false; } else ctx.lineTo(x, y); }
    });
    ctx.stroke();

    // E. PRECIO ACTUAL EN TIEMPO REAL
    const currentPrice = aggregatedCandles[aggregatedCandles.length - 1].close;
    const currentY = getY(currentPrice);
    if (currentY >= paddingTop && currentY <= paddingTop + mainHeight) {
      const isUp = aggregatedCandles[aggregatedCandles.length - 1].close >= aggregatedCandles[aggregatedCandles.length - 1].open;
      ctx.fillStyle = isUp ? "#22c55e" : "#ef4444";
      ctx.fillRect(canvas.width - paddingRight, currentY - 8, 70, 16);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 10px monospace";
      ctx.fillText(currentPrice.toFixed(5), canvas.width - paddingRight + 4, currentY + 4);
    }

    // F. SUBPANEL RSI
    const rsiTop = canvas.height - rsiHeight - 10;
    ctx.fillStyle = "#090d14"; ctx.fillRect(paddingLeft, rsiTop, width, rsiHeight);
    ctx.strokeStyle = "#2a2e39"; ctx.strokeRect(paddingLeft, rsiTop, width, rsiHeight);

    const getRsiY = (val) => rsiTop + rsiHeight - (val / 100) * rsiHeight;
    ctx.strokeStyle = "rgba(239, 68, 68, 0.3)"; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(paddingLeft, getRsiY(70)); ctx.lineTo(paddingLeft + width, getRsiY(70)); ctx.stroke();
    ctx.strokeStyle = "rgba(34, 197, 94, 0.3)";
    ctx.beginPath(); ctx.moveTo(paddingLeft, getRsiY(30)); ctx.lineTo(paddingLeft + width, getRsiY(30)); ctx.stroke(); ctx.setLineDash([]);

    ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 1.5; ctx.beginPath();
    let fRsi = true;
    visibleData.forEach((v, i) => {
      if (v.rsi) {
        const x = getX(i), y = getRsiY(v.rsi);
        if (fRsi) { ctx.moveTo(x, y); fRsi = false; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    ctx.fillStyle = "#a855f7"; ctx.font = "10px monospace";
    ctx.fillText(`RSI (14) [${getTimeframeLabel()}]: ${(visibleData[visibleData.length - 1]?.rsi || 50).toFixed(1)}`, paddingLeft + 5, rsiTop + 12);
  }

  // 7. INICIALIZACIÓN Y BUCLE PRINCIPAL
  function initEngine() {
    rawTicks = [];
    for(let i = 0; i < 500; i++) {
      lastPrice += (Math.random() - 0.495) * 0.00020;
      rawTicks.push(lastPrice);
    }
    reconstruirVelasFractales();
    drawCFD();
  }

  function loopTick() {
    generarNuevoTick();
    reconstruirVelasFractales();
    drawCFD();
  }

  window.cambiarTimeframe = function(factor) {
    timeframeFactor = parseInt(factor);
    viewOffset = 0;
    reconstruirVelasFractales();
    drawCFD();
    logConsole("SISTEMA", `Fractal cambiado a ${getTimeframeLabel()}. Reagrupando velas.`);
  };

  window.inyectarNoticia = function(tipo) {
    if (tipo === 'NFP') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.3 + Math.random() * 0.8);
      logConsole("NOTICIA MACRO", "💥 Shock NFP inyectado en el flujo de ticks.");
    } else if (tipo === 'BCE') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.0 + Math.random() * 0.5);
      logConsole("NOTICIA MACRO", "🏛️ Shock BCE inyectado en el flujo de ticks.");
    }
  };

  initEngine();
  updateInterval = setInterval(loopTick, 1000); // Ticks en vivo cada 1 segundo

  // 8. CHAT COPILOT IA
  const iaConsole = document.getElementById("ia-console");
  let chatHistory = [];

  function logConsole(source, text){
    if (!iaConsole) return;
    const timestamp = new Date().toLocaleTimeString();
    chatHistory.push(`[${timestamp}] [${source}] ${text}`);
    iaConsole.innerText = chatHistory.slice(-40).join("\n\n");
    iaConsole.scrollTop = iaConsole.scrollHeight;
  }

  window.sendMessage = function(){
    const input = document.getElementById("chat-input");
    if (!input) return;
    const msg = input.value.trim();
    if(!msg) return;
    input.value = "";
    logConsole("USER", msg);
    processMessage(msg);
  };

  function processMessage(msg){
    const cleanMsg = msg.toLowerCase();
    const lastCandle = aggregatedCandles[aggregatedCandles.length - 1] || {};
    const price = lastCandle.close ? lastCandle.close.toFixed(5) : "1.08500";

    let response = "";
    if (cleanMsg.includes("fractal") || cleanMsg.includes("timeframe") || cleanMsg.includes("tiempo")) {
      response = `ANÁLISIS FRACTAL DE MERCADO:\n ├─ Fractal Activo: ${getTimeframeLabel()}\n ├─ Velas Totales Agrupadas: ${aggregatedCandles.length}\n └─ Las velas cambian de forma porque agrupan más ticks según el marco temporal.`;
    } else {
      response = `COPILOT IA:\n ├─ Cotización actual: ${price}\n ├─ Fractal: ${getTimeframeLabel()}\n ├─ RSI: ${(lastCandle.rsi || 50).toFixed(1)}\n └─ Motor multi-temporal activo.`;
    }

    setTimeout(() => logConsole("COPILOT IA", response), 200);
  }

  function showAlert(msg, typeClass = "alert-info"){
    const box = document.getElementById("alertBox");
    if (!box) return;
    const div = document.createElement("div");
    div.className = `alert ${typeClass}`;
    div.innerText = msg;
    box.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  logConsole("SISTEMA", "Engine v7.0 Activo.\nFractalidad en tiempo real integrada.");
});
</script>
</body>
