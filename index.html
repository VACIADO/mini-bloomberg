<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Pro Terminal – PineScript AI Strategy Engine</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#0b0e14; color:#fff; display:flex; flex-wrap:wrap; gap:10px; padding:10px; justify-content:center;}
  .panel { border:1px solid #2a2e39; border-radius:8px; background:#131722; padding:10px; flex:1 1 45%; min-width:320px; display:flex; flex-direction:column; height:460px;}
  h2 { margin:0 0 8px 0; text-align:center; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; color: #f59e0b; }
  .text-euro { color: #3b82f6; }
  .text-dolar { color: #ef4444; }
  .tradingview-widget-container { flex:1; margin-top:3px; border-radius:4px; overflow:hidden; min-height: 60px; }
  
  .header-cfd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .timeframe-select, .btn-macro { background: #1e222d; color: #f59e0b; border: 1px solid #2a2e39; border-radius: 4px; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
  .btn-macro:hover { background: #2a2e39; color: #fff; }
  .btn-nfp { color: #ef4444; border-color: #ef4444; }
  .btn-bce { color: #3b82f6; border-color: #3b82f6; }

  #cfd-container { flex:1; border:1px solid #2a2e39; border-radius:6px; position:relative; background:#000; overflow:hidden; }
  #cfd-canvas { width:100%; height:100%; display:block; }
  
  #ia-news-container { display:flex; gap:10px; height:160px; margin-top:8px; }
  #ia-console { flex:1.3; background:#05070a; color:#00ff66; font-family:'Courier New', Courier, monospace; padding:8px; overflow-y:auto; font-size:0.75rem; border-radius:4px; border:1px solid #2a2e39; line-height: 1.4; }
  .news-panel { flex:1; background:#131722; padding:8px; border-radius:4px; border:1px solid #2a2e39; display:flex; flex-direction:column; }
  .news-panel h3 { margin:0 0 5px 0; font-size:11px; color:#8f9cae; text-transform:uppercase; display:flex; justify-content:space-between; }
  
  .input-group { display:flex; gap:6px; margin-top:auto; }
  input[type="text"] { flex:1; padding:8px; border-radius:4px; border:1px solid #2a2e39; background:#1e222d; color:#fff; font-size:0.8rem; outline:none; }
  input[type="text"]:focus { border-color: #f59e0b; }
  button.btn-send { padding:8px 14px; border-radius:4px; border:none; background:#f59e0b; color:#000; font-weight:bold; cursor:pointer; font-size:0.8rem; transition: background 0.2s; }
  button.btn-send:hover { background:#d97706; }
  
  #alertBox { position:absolute; top:10px; right:10px; z-index:10; display:flex; flex-direction:column; gap:6px; }
  .alert { padding:8px 12px; font-size:0.75rem; font-weight:bold; border-radius:4px; box-shadow:0 4px 6px rgba(0,0,0,0.6); animation: fadeIn 0.3s forwards; }
  .alert-buy { background:#16a34a; color:#fff; border-left:4px solid #4ade80; }
  .alert-sell { background:#dc2626; color:#fff; border-left:4px solid #f87171; }
  .alert-info { background:#2563eb; color:#fff; border-left:4px solid #60a5fa; }
  
  @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- PANEL EQUIPO EURO -->
<div class="panel">
  <h2 class="text-euro">🇪🇺 Bloque Euro (Fuerza Eurozona)</h2>
  <div class="tradingview-widget-container" id="tv_exy"></div>
  <div class="tradingview-widget-container" id="tv_eurodolar"></div>
  <div class="tradingview-widget-container" id="tv_bono_eu"></div>
  <div class="tradingview-widget-container" id="tv_eurjpy"></div>
  <div class="tradingview-widget-container" id="tv_dax"></div>
</div>

<!-- PANEL EQUIPO DÓLAR -->
<div class="panel">
  <h2 class="text-dolar">🇺🇸 Bloque Dólar (Fuerza USD / Inflación)</h2>
  <div class="tradingview-widget-container" id="tv_dxy"></div>
  <div class="tradingview-widget-container" id="tv_bono_us"></div>
  <div class="tradingview-widget-container" id="tv_brent"></div>
  <div class="tradingview-widget-container" id="tv_sp500"></div>
  <div class="tradingview-widget-container" id="tv_vix"></div>
</div>

<!-- PANEL CFD SINTÉTICO & MOTOR PINE SCRIPT AI -->
<div class="panel" style="flex:1 1 95%; height: 560px;">
  <div class="header-cfd">
    <h2>⚡ BLOOMBERG PRO CFD ENGINE v5.2 (BOLLINGER + RSI + MACRO SHOCKS)</h2>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn-macro btn-nfp" onclick="window.inyectarNoticia('NFP')">💥 Shock NFP US</button>
      <button class="btn-macro btn-bce" onclick="window.inyectarNoticia('BCE')">🏛️ Shock Tasas BCE</button>
      <select id="tf-select" class="timeframe-select" onchange="window.cambiarTimeframe(this.value)">
        <option value="1000">M1 (1s)</option>
        <option value="3000" selected>M5 (3s)</option>
        <option value="5000">M15 (5s)</option>
      </select>
    </div>
  </div>
  
  <div id="cfd-container">
    <div id="alertBox"></div>
    <canvas id="cfd-canvas"></canvas>
  </div>
  
  <div id="ia-news-container">
    <div id="ia-console"></div>
    <div class="news-panel">
      <h3>
        <span>Copilot IA Macro & Risk Manager</span>
        <span id="risk-display" style="color:#f59e0b;">Lote Sugerido: 0.10</span>
      </h3>
      <p style="font-size:0.75rem; color:#8f9cae; margin:0 0 8px 0;">Consulta sobre RSI, Bollinger, riesgo o lanza una noticia personalizada.</p>
      <div class="input-group">
        <input type="text" id="chat-input" placeholder="Ej: ¿RSI sobrecomprado?, Bollinger, Calcular Lote, Noticia..." onkeypress="if(event.key==='Enter') window.sendMessage()">
        <button class="btn-send" onclick="window.sendMessage()">Analizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. INTEGRACIÓN WIDGETS
  function crearWidget(containerId, symbol){
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    if (typeof TradingView !== 'undefined') {
      new TradingView.widget({
        container_id: containerId, symbol: symbol, interval: "15",
        timezone: "Europe/Madrid", theme: "dark", style: "1", locale: "es",
        hide_top_toolbar: true, hide_legend: true, width: "100%", height: "100%"
      });
    }
  }

  const widgets = {
    tv_exy: "FX_IDC:EURUSD", tv_eurodolar: "FX:EURUSD", tv_bono_eu: "TICKERS:DE10Y", tv_eurjpy: "FX:EURJPY", tv_dax: "GLOBALDATA:DAX",
    tv_dxy: "CAPITALCOM:DXY", tv_bono_us: "TVC:US10Y", tv_brent: "TVC:UKOIL", tv_sp500: "FOREXCOM:SPXUSD", tv_vix: "TVC:VIX"
  };
  for(const id in widgets) crearWidget(id, widgets[id]);

  // 2. MOTOR CFD
  let cfdData = [];
  let lastClose = 100.00;
  let updateInterval = null;
  let currentSpeed = 3000;
  let shockVolatilidad = 0;

  const canvas = document.getElementById("cfd-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){ 
    canvas.width = canvas.parentElement.clientWidth; 
    canvas.height = canvas.parentElement.clientHeight; 
  }
  window.addEventListener("resize", () => { resizeCanvas(); drawCFD(); });
  resizeCanvas();

  function obtenerCambioPorcentual() {
    let base = (Math.random() - 0.495) * 0.20;
    if (shockVolatilidad !== 0) {
      base += shockVolatilidad;
      shockVolatilidad *= 0.6; // Amortiguación del impacto
      if (Math.abs(shockVolatilidad) < 0.01) shockVolatilidad = 0;
    }
    return base;
  }

  function calcularNuevoPrecioCFD() {
    const netDelta = obtenerCambioPorcentual();
    return lastClose * (1 + netDelta / 100);
  }

  // 3. CÁLCULOS TÉCNICOS PINE SCRIPT v5 (SMA, RSI, BOLLINGER, ATR)
  function ta_sma(data, length) {
    if (data.length < length) return null;
    const slice = data.slice(-length);
    return slice.reduce((acc, val) => acc + val.close, 0) / length;
  }

  function ta_rsi(data, length = 14) {
    if (data.length < length + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = data.length - length; i < data.length; i++) {
      const diff = data[i].close - data[i - 1].close;
      if (diff >= 0) gains += diff;
      else losses -= diff;
    }
    const avgGain = gains / length;
    const avgLoss = losses / length;
    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
  }

  function ta_bollinger(data, length = 20, mult = 2) {
    const sma = ta_sma(data, length);
    if (!sma) return null;
    const slice = data.slice(-length);
    const variance = slice.reduce((acc, val) => acc + Math.pow(val.close - sma, 2), 0) / length;
    const stdDev = Math.sqrt(variance);
    return { upper: sma + (stdDev * mult), lower: sma - (stdDev * mult), middle: sma };
  }

  function ta_atr(data, length = 14) {
    if (data.length < length + 1) return 0.2;
    let trSum = 0;
    for (let i = data.length - length; i < data.length; i++) {
      const high = data[i].high, low = data[i].low, prevClose = data[i - 1].close;
      trSum += Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
    }
    return trSum / length;
  }

  let memoryLastSuccessPrice = null;
  let memoryLastClosedSignal = null;

  function analizarPineScriptEngine() {
    if (cfdData.length < 5) return;

    const currentIdx = cfdData.length - 1;
    const currentCandle = cfdData[currentIdx];

    const shortMA = ta_sma(cfdData, 20);
    const longMA = ta_sma(cfdData, 50);
    const rsi = ta_rsi(cfdData, 14);
    const bb = ta_bollinger(cfdData, 20, 2);
    const atr = ta_atr(cfdData, 14);

    const prevShortMA = ta_sma(cfdData.slice(0, -1), 20);
    const prevLongMA = ta_sma(cfdData.slice(0, -1), 50);

    const buySignal = prevShortMA && prevLongMA && (prevShortMA <= prevLongMA) && (shortMA > longMA);
    const sellSignal = prevShortMA && prevLongMA && (prevShortMA >= prevLongMA) && (longMA > shortMA);

    currentCandle.shortMA = shortMA;
    currentCandle.longMA = longMA;
    currentCandle.rsi = rsi;
    currentCandle.bb = bb;

    // Calculadora de Gestión de Riesgo (1% riesgo sobre $10,000)
    const riskAmount = 100; // $100 por trade
    const stopLossPips = atr * 1.0;
    const lotSize = Math.max(0.01, (riskAmount / (stopLossPips * 100))).toFixed(2);
    document.getElementById("risk-display").innerText = `Lote Risk (1%): ${lotSize}`;

    if (buySignal) {
      const target = currentCandle.close + atr * 1.5;
      const stop = currentCandle.close - stopLossPips;
      currentCandle.signal = { type: "BUY" };
      showAlert(`COMPRA 🚀 @ ${currentCandle.close.toFixed(2)} | Target: ${target.toFixed(2)}`, "alert-buy");
      logConsole("PINE ENGINE", `🚀 COMPRA (SMA 20/50). Lote Sugerido: ${lotSize} | RSI: ${rsi.toFixed(1)}`);
      memoryLastClosedSignal = "BUY"; memoryLastSuccessPrice = currentCandle.close;
    } else if (sellSignal) {
      const target = currentCandle.close - atr * 1.5;
      const stop = currentCandle.close + stopLossPips;
      currentCandle.signal = { type: "SELL" };
      showAlert(`VENTA 🪂 @ ${currentCandle.close.toFixed(2)} | Target: ${target.toFixed(2)}`, "alert-sell");
      logConsole("PINE ENGINE", `🪂 VENTA (SMA 20/50). Lote Sugerido: ${lotSize} | RSI: ${rsi.toFixed(1)}`);
      memoryLastClosedSignal = "SELL"; memoryLastSuccessPrice = currentCandle.close;
    }
  }

  // 4. RENDERING CANVAS CON RSI Y BOLLINGER
  function generarVela(){ 
    const open = lastClose; 
    const close = calcularNuevoPrecioCFD(); 
    const high = Math.max(open, close) + Math.random() * 0.08; 
    const low = Math.min(open, close) - Math.random() * 0.08; 
    lastClose = close; 
    return { open, high, low, close };
  }

  function initCFD(){ 
    cfdData = [];
    for(let i = 0; i < 60; i++){ 
      cfdData.push(generarVela()); 
      analizarPineScriptEngine();
    }
    drawCFD();
  }

  function drawCFD(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(cfdData.length === 0) return;

    const padding = 40;
    const rsiHeight = 80; // Altura reservada para el sub-panel RSI
    const mainHeight = canvas.height - padding * 2 - rsiHeight - 10;
    const width = canvas.width - padding * 2;

    const max = Math.max(...cfdData.map(v => v.high)) + 0.05;
    const min = Math.min(...cfdData.map(v => v.low)) - 0.05;

    const getX = (i) => padding + (i / (cfdData.length - 1 || 1)) * width;
    const getY = (val) => padding + (max - val) / Math.max(0.001, (max - min)) * mainHeight;

    // A. Bandas de Bollinger (Sombra)
    ctx.fillStyle = "rgba(59, 130, 246, 0.05)";
    ctx.beginPath();
    let firstBB = true;
    cfdData.forEach((v, i) => {
      if (v.bb) {
        const x = getX(i), yUpper = getY(v.bb.upper);
        if (firstBB) { ctx.moveTo(x, yUpper); firstBB = false; } else ctx.lineTo(x, yUpper);
      }
    });
    for (let i = cfdData.length - 1; i >= 0; i--) {
      if (cfdData[i].bb) ctx.lineTo(getX(i), getY(cfdData[i].bb.lower));
    }
    ctx.closePath(); ctx.fill();

    // B. Velas
    const candleWidth = Math.max(3, (width / cfdData.length) - 3);
    cfdData.forEach((v, i) => {
      const x = getX(i), yOpen = getY(v.open), yClose = getY(v.close), yHigh = getY(v.high), yLow = getY(v.low);
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();
      ctx.fillStyle = (v.close >= v.open) ? "#22c55e" : "#ef4444";
      ctx.fillRect(x - candleWidth/2, Math.min(yOpen, yClose), candleWidth, Math.max(2, Math.abs(yClose - yOpen)));

      if (v.signal) {
        ctx.fillStyle = v.signal.type === "BUY" ? "#22c55e" : "#ef4444";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(v.signal.type === "BUY" ? "🚀 BUY" : "🪂 SELL", x - 15, v.signal.type === "BUY" ? yLow + 18 : yHigh - 10);
      }
    });

    // C. Medias Móviles
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = 2; ctx.beginPath();
    let f20 = true;
    cfdData.forEach((v, i) => {
      if (v.shortMA) { const x = getX(i), y = getY(v.shortMA); if (f20) { ctx.moveTo(x, y); f20 = false; } else ctx.lineTo(x, y); }
    });
    ctx.stroke();

    // D. SUB-PANEL RSI (Abajo)
    const rsiTop = canvas.height - rsiHeight - 15;
    ctx.fillStyle = "#090d14";
    ctx.fillRect(padding, rsiTop, width, rsiHeight);
    ctx.strokeStyle = "#2a2e39"; ctx.strokeRect(padding, rsiTop, width, rsiHeight);

    // Líneas Nivel 70 y 30
    const getRsiY = (val) => rsiTop + rsiHeight - (val / 100) * rsiHeight;
    ctx.strokeStyle = "rgba(239, 68, 68, 0.4)"; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(padding, getRsiY(70)); ctx.lineTo(canvas.width - padding, getRsiY(70)); ctx.stroke();
    ctx.strokeStyle = "rgba(34, 197, 94, 0.4)";
    ctx.beginPath(); ctx.moveTo(padding, getRsiY(30)); ctx.lineTo(canvas.width - padding, getRsiY(30)); ctx.stroke();
    ctx.setLineDash([]);

    // Línea RSI (Púrpura)
    ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 1.5; ctx.beginPath();
    let fRsi = true;
    cfdData.forEach((v, i) => {
      if (v.rsi) {
        const x = getX(i), y = getRsiY(v.rsi);
        if (fRsi) { ctx.moveTo(x, y); fRsi = false; } else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();

    ctx.fillStyle = "#a855f7"; ctx.font = "10px monospace";
    const lastRsi = cfdData[cfdData.length - 1]?.rsi || 50;
    ctx.fillText(`RSI (14): ${lastRsi.toFixed(1)}`, padding + 5, rsiTop + 14);
  }

  function updateCFD(){ 
    cfdData.push(generarVela()); 
    if(cfdData.length > 70) cfdData.shift(); 
    analizarPineScriptEngine();
    drawCFD(); 
  }

  function startLoop(speed) {
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(updateCFD, speed);
  }

  window.cambiarTimeframe = function(newSpeed) {
    currentSpeed = parseInt(newSpeed);
    startLoop(currentSpeed);
    logConsole("SISTEMA", `Timeframe actualizado a ${currentSpeed / 1000}s por vela.`);
  };

  window.inyectarNoticia = function(tipo) {
    if (tipo === 'NFP') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 0.8);
      logConsole("NOTICIA MACRO", "💥 Publicación NFP EE.UU. Nomina no agrícola genera alta volatilidad.");
    } else if (tipo === 'BCE') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.0 + Math.random() * 0.5);
      logConsole("NOTICIA MACRO", "🏛️ Decisión de Tasas BCE: Movimiento brusco registrado en el Bloque Euro.");
    }
  };

  initCFD();
  startLoop(currentSpeed);

  // 5. CONSOLA IA
  const iaConsole = document.getElementById("ia-console");
  let chatHistory = [];

  function logConsole(source, text){
    if (!iaConsole) return;
    const timestamp = new Date().toLocaleTimeString();
    chatHistory.push(`[${timestamp}] [${source}] ${text}`);
    iaConsole.innerText = chatHistory.slice(-40).join("\n\n");
    iaConsole.scrollTop = iaConsole.scrollHeight;
  }

  window.sendMessage = function(){
    const input = document.getElementById("chat-input");
    if (!input) return;
    const msg = input.value.trim();
    if(!msg) return;
    input.value = "";
    logConsole("USER", msg);
    processMessage(msg);
  };

  function processMessage(msg){
    const cleanMsg = msg.toLowerCase();
    const lastCandle = cfdData[cfdData.length - 1];
    let response = "";

    if (cleanMsg.includes("rsi")) {
      const rsiVal = lastCandle.rsi ? lastCandle.rsi.toFixed(1) : "50";
      const estado = rsiVal > 70 ? "🔴 SOBRECOMPRA (>70)" : rsiVal < 30 ? "🟢 SOBREVENTA (<30)" : "🟡 NEUTRO";
      response = `ANÁLISIS DE RSI (14):\n ├─ Valor actual: ${rsiVal}\n └─ Diagnóstico: ${estado}`;
    }
    else if (cleanMsg.includes("bollinger") || cleanMsg.includes("bandas")) {
      const upper = lastCandle.bb ? lastCandle.bb.upper.toFixed(2) : "N/A";
      const lower = lastCandle.bb ? lastCandle.bb.lower.toFixed(2) : "N/A";
      response = `BANDAS DE BOLLINGER (20, 2):\n ├─ Banda Superior: ${upper}\n ├─ Banda Inferior: ${lower}\n └─ Volatilidad expandiéndose.`;
    }
    else if (cleanMsg.includes("riesgo") || cleanMsg.includes("lote")) {
      response = `GESTIÓN DE RIESGO TERMINAL:\n ├─ Capital Base: $10,000\n ├─ Riesgo Max Trade: 1% ($100)\n └─ Lote Sugerido para el siguiente trade: Ajustado por ATR actual.`;
    }
    else {
      response = `IA COPILOT: Comando reconocido ("${msg}"). Motor PineScript analizando estructuras de Bollinger y RSI. Balance sin variaciones.`;
    }

    setTimeout(() => logConsole("IA CORE", response), 200);
  }

  function showAlert(msg, typeClass = "alert-info"){
    const box = document.getElementById("alertBox");
    if (!box) return;
    const div = document.createElement("div");
    div.className = `alert ${typeClass}`;
    div.innerText = msg;
    box.appendChild(div);
    setTimeout(() => div.remove(), 5000);
  }

  logConsole("SISTEMA", "Bloomberg Terminal Pro v5.2 Iniciado.\nIndicadores RSI, Bollinger y Botones Macro activos.");
});
</script>
</body>
</html>
