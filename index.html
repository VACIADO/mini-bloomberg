<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Pro Terminal v6.0 – Final Corregida e Interactiva</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#0b0e14; color:#fff; display:flex; flex-wrap:wrap; gap:10px; padding:10px; justify-content:center;}
  .panel { border:1px solid #2a2e39; border-radius:8px; background:#131722; padding:10px; flex:1 1 45%; min-width:320px; display:flex; flex-direction:column; height:460px;}
  h2 { margin:0 0 8px 0; text-align:center; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; color: #f59e0b; }
  .text-euro { color: #3b82f6; }
  .text-dolar { color: #ef4444; }
  .tradingview-widget-container { flex:1; margin-top:3px; border-radius:4px; overflow:hidden; min-height: 60px; }
  
  .header-cfd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .timeframe-select, .btn-macro { background: #1e222d; color: #f59e0b; border: 1px solid #2a2e39; border-radius: 4px; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
  .btn-macro:hover { background: #2a2e39; color: #fff; }
  .btn-nfp { color: #ef4444; border-color: #ef4444; }
  .btn-bce { color: #3b82f6; border-color: #3b82f6; }

  #cfd-container { flex:1; border:1px solid #2a2e39; border-radius:6px; position:relative; background:#05070a; overflow:hidden; cursor: crosshair; }
  #cfd-canvas { width:100%; height:100%; display:block; }
  
  #ia-news-container { display:flex; gap:10px; height:160px; margin-top:8px; }
  #ia-console { flex:1.3; background:#05070a; color:#00ff66; font-family:'Courier New', Courier, monospace; padding:8px; overflow-y:auto; font-size:0.75rem; border-radius:4px; border:1px solid #2a2e39; line-height: 1.4; }
  .news-panel { flex:1; background:#131722; padding:8px; border-radius:4px; border:1px solid #2a2e39; display:flex; flex-direction:column; }
  .news-panel h3 { margin:0 0 5px 0; font-size:11px; color:#8f9cae; text-transform:uppercase; display:flex; justify-content:space-between; }
  
  .input-group { display:flex; gap:6px; margin-top:auto; }
  input[type="text"] { flex:1; padding:8px; border-radius:4px; border:1px solid #2a2e39; background:#1e222d; color:#fff; font-size:0.8rem; outline:none; }
  input[type="text"]:focus { border-color: #f59e0b; }
  button.btn-send { padding:8px 14px; border-radius:4px; border:none; background:#f59e0b; color:#000; font-weight:bold; cursor:pointer; font-size:0.8rem; transition: background 0.2s; }
  button.btn-send:hover { background:#d97706; }
  
  #alertBox { position:absolute; top:10px; right:75px; z-index:10; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .alert { padding:8px 12px; font-size:0.75rem; font-weight:bold; border-radius:4px; box-shadow:0 4px 6px rgba(0,0,0,0.6); animation: fadeIn 0.3s forwards; }
  .alert-buy { background:#16a34a; color:#fff; border-left:4px solid #4ade80; }
  .alert-sell { background:#dc2626; color:#fff; border-left:4px solid #f87171; }
  .alert-info { background:#2563eb; color:#fff; border-left:4px solid #60a5fa; }
  
  @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- PANEL EQUIPO EURO -->
<div class="panel">
  <h2 class="text-euro">🇪🇺 Bloque Euro (Fuerza Eurozona)</h2>
  <div class="tradingview-widget-container" id="tv_exy"></div>
  <div class="tradingview-widget-container" id="tv_eurodolar"></div>
  <div class="tradingview-widget-container" id="tv_bono_eu"></div> <!-- ARREGLADO -->
  <div class="tradingview-widget-container" id="tv_eurjpy"></div>
  <div class="tradingview-widget-container" id="tv_dax"></div> <!-- ARREGLADO -->
</div>

<!-- PANEL EQUIPO DÓLAR -->
<div class="panel">
  <h2 class="text-dolar">🇺🇸 Bloque Dólar (Fuerza USD / Inflación)</h2>
  <div class="tradingview-widget-container" id="tv_dxy"></div>
  <div class="tradingview-widget-container" id="tv_bono_us"></div>
  <div class="tradingview-widget-container" id="tv_brent"></div>
  <div class="tradingview-widget-container" id="tv_sp500"></div>
  <div class="tradingview-widget-container" id="tv_vix"></div>
</div>

<!-- PANEL CFD SINTÉTICO & MOTOR PINE SCRIPT AI -->
<div class="panel" style="flex:1 1 95%; height: 560px;">
  <div class="header-cfd">
    <h2>⚡ BLOOMBERG PRO CFD ENGINE v6.0 (INTERACTIVO: ZOOM & PAN)</h2>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn-macro btn-nfp" onclick="window.inyectarNoticia('NFP')">💥 Shock NFP US</button>
      <button class="btn-macro btn-bce" onclick="window.inyectarNoticia('BCE')">🏛️ Shock Tasas BCE</button>
      <select id="tf-select" class="timeframe-select" onchange="window.cambiarTimeframe(this.value)">
        <option value="1000">M1 (1s)</option>
        <option value="3000" selected>M5 (3s)</option>
        <option value="5000">M15 (5s)</option>
      </select>
    </div>
  </div>
  
  <div id="cfd-container">
    <div id="alertBox"></div>
    <canvas id="cfd-canvas"></canvas>
  </div>
  
  <div id="ia-news-container">
    <div id="ia-console"></div>
    <div class="news-panel">
      <h3>
        <span>Copilot IA Macro Engine</span>
        <span id="risk-display" style="color:#f59e0b;">Lote: 0.10</span>
      </h3>
      <p style="font-size:0.75rem; color:#8f9cae; margin:0 0 8px 0;">Consulta Tendencia, RSI o dirección del EUR/USD. Zoom/Arrastra el gráfico.</p>
      <div class="input-group">
        <input type="text" id="chat-input" placeholder="Ej: ¿Qué tendencia hay?, ¿RSI sobrecomprado?, direction..." onkeypress="if(event.key==='Enter') window.sendMessage()">
        <button class="btn-send" onclick="window.sendMessage()">Analizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. INTEGRACIÓN WIDGETS TRADINGVIEW (REPARADOS)
  function crearWidget(containerId, symbol){
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    if (typeof TradingView !== 'undefined') {
      new TradingView.widget({
        container_id: containerId, symbol: symbol, interval: "15",
        timezone: "Europe/Madrid", theme: "dark", style: "1", locale: "es",
        hide_top_toolbar: true, hide_legend: true, width: "100%", height: "100%"
      });
    }
  }

  // Tickers estables corregidos
  const widgets = {
    tv_exy: "FX_IDC:EURUSD", tv_eurodolar: "FX:EURUSD", 
    tv_bono_eu: "TVC:DE10Y", // BONO ALEMANIA 10Y
    tv_eurjpy: "FX:EURJPY", 
    tv_dax: "CAPITALCOM:DE40", // DAX 40
    tv_dxy: "CAPITALCOM:DXY", tv_bono_us: "TVC:US10Y", tv_brent: "TVC:UKOIL", tv_sp500: "FOREXCOM:SPXUSD", tv_vix: "TVC:VIX"
  };
  for(const id in widgets) crearWidget(id, widgets[id]);

  // 2. MOTOR CFD Y VARIABLES DE ZOOM/DESPLAZAMIENTO
  let cfdData = [];
  let lastClose = 100.00;
  let updateInterval = null;
  let currentSpeed = 3000;
  let shockVolatilidad = 0;

  // Variables de Zoom y Pan
  let visibleCandles = 50; 
  let viewOffset = 0; 
  let isDragging = false;
  let startX = 0;

  const canvas = document.getElementById("cfd-canvas");
  const container = document.getElementById("cfd-container");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){ 
    canvas.width = container.clientWidth; 
    canvas.height = container.clientHeight; 
  }
  window.addEventListener("resize", () => { resizeCanvas(); drawCFD(); });
  resizeCanvas();

  // 3. EVENTOS DE ZOOM Y ARRASTRE (INTERACTIVIDAD)
  // Zoom con rueda del ratón
  container.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.deltaY < 0) {
      visibleCandles = Math.max(10, visibleCandles - 3); // Zoom in
    } else {
      visibleCandles = Math.min(200, visibleCandles + 3); // Zoom out
    }
    drawCFD();
  }, { passive: false });

  // Arrastre con clic izquierdo
  container.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
    container.style.cursor = "grabbing";
  });

  window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "crosshair";
  });

  container.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const deltaX = startX - e.clientX;
    if (Math.abs(deltaX) > 5) {
      const candlesToMove = Math.round(deltaX / (canvas.width / visibleCandles));
      if (candlesToMove !== 0) {
        viewOffset = Math.max(0, Math.min(cfdData.length - visibleCandles, viewOffset + candlesToMove));
        startX = e.clientX;
        drawCFD();
      }
    }
  });

  function obtenerCambioPorcentual() {
    let base = (Math.random() - 0.495) * 0.20;
    if (shockVolatilidad !== 0) {
      base += shockVolatilidad;
      shockVolatilidad *= 0.6; // Amortiguación
      if (Math.abs(shockVolatilidad) < 0.01) shockVolatilidad = 0;
    }
    return base;
  }

  function calcularNuevoPrecioCFD() {
    const netDelta = obtenerCambioPorcentual();
    return lastClose * (1 + netDelta / 100);
  }

  // 4. INDICADORES PINE SCRIPT AI (SMA & RSI)
  function ta_sma(data, length) {
    if (data.length < length) return null;
    return data.slice(-length).reduce((acc, val) => acc + val.close, 0) / length;
  }

  function ta_rsi(data, length = 14) {
    if (data.length < length + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = data.length - length; i < data.length; i++) {
      const diff = data[i].close - data[i - 1].close;
      if (diff >= 0) gains += diff; else losses -= diff;
    }
    const avgGain = gains / length, avgLoss = losses / length;
    if (avgLoss === 0) return 100;
    return 100 - (100 / (1 + (avgGain / avgLoss)));
  }

  function analizarPineScriptEngine() {
    if (cfdData.length < 5) return;
    const current = cfdData[cfdData.length - 1];
    const shortMA = ta_sma(cfdData, 20);
    const longMA = ta_sma(cfdData, 50);
    const rsi = ta_rsi(cfdData, 14);

    current.shortMA = shortMA;
    current.longMA = longMA;
    current.rsi = rsi;

    const prevShortMA = ta_sma(cfdData.slice(0, -1), 20);
    const prevLongMA = ta_sma(cfdData.slice(0, -1), 50);

    const buySignal = prevShortMA && prevLongMA && (prevShortMA <= prevLongMA) && (shortMA > longMA);
    const sellSignal = prevShortMA && prevLongMA && (prevShortMA >= prevLongMA) && (longMA > shortMA);

    if (buySignal) {
      current.signal = { type: "BUY" };
      showAlert(`COMPRA IA 🚀 @ ${current.close.toFixed(2)}`, "alert-buy");
      logConsole("PINE ENGINE", `🚀 SEÑAL BUY (SMA Cross) | RSI: ${rsi.toFixed(1)}`);
    } else if (sellSignal) {
      current.signal = { type: "SELL" };
      showAlert(`VENTA IA 🪂 @ ${current.close.toFixed(2)}`, "alert-sell");
      logConsole("PINE ENGINE", `🪂 SEÑAL SELL (SMA Cross) | RSI: ${rsi.toFixed(1)}`);
    }
  }

  // 5. RENDERING DIBUJO EN CANVAS (CON ESCALA Y INTERACTIVIDAD)
  function generarVela(){ 
    const open = lastClose; 
    const close = calcularNuevoPrecioCFD(); 
    const high = Math.max(open, close) + Math.random() * 0.08; 
    const low = Math.min(open, close) - Math.random() * 0.08; 
    lastClose = close; 
    return { open, high, low, close };
  }

  function initCFD(){ 
    cfdData = [];
    for(let i = 0; i < 100; i++){ 
      cfdData.push(generarVela()); 
      analizarPineScriptEngine();
    }
    drawCFD();
  }

  function drawCFD(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(cfdData.length === 0) return;

    const padding = 40;
    const mainHeight = canvas.height - padding * 2;
    const width = canvas.width - padding * 2 - 50; // Margen derecho para escala

    // Seleccionar subconjunto de datos para Zoom / Pan
    const endIndex = Math.max(0, cfdData.length - viewOffset);
    const startIndex = Math.max(0, endIndex - visibleCandles);
    const visibleData = cfdData.slice(startIndex, endIndex);

    if (visibleData.length === 0) return;

    const max = Math.max(...visibleData.map(v => v.high)) + 0.05;
    const min = Math.min(...visibleData.map(v => v.low)) - 0.05;

    const getX = (i) => padding + (i / (visibleData.length - 1 || 1)) * width;
    const getY = (val) => padding + (max - val) / Math.max(0.001, (max - min)) * mainHeight;

    // A. REJILLA Y ESCALA LATERAL VISIBLE
    ctx.strokeStyle = "#1e222d"; ctx.lineWidth = 1; ctx.fillStyle = "#8f9cae"; ctx.font = "10px monospace";
    for (let i = 0; i <= 5; i++) {
      const priceVal = min + (i / 5) * (max - min);
      const yPos = getY(priceVal);
      ctx.beginPath(); ctx.moveTo(padding, yPos); ctx.lineTo(canvas.width - padding - 40, yPos); ctx.stroke();
      ctx.fillText(priceVal.toFixed(2), canvas.width - padding - 35, yPos + 3);
    }

    // B. DIBUJO DE VELAS
    const candleWidth = Math.max(2, (width / visibleData.length) - 3);
    visibleData.forEach((v, i) => {
      const x = getX(i), yOpen = getY(v.open), yClose = getY(v.close), yHigh = getY(v.high), yLow = getY(v.low);
      // Mecha
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();
      // Cuerpo
      ctx.fillStyle = (v.close >= v.open) ? "#22c55e" : "#ef4444";
      ctx.fillRect(x - candleWidth/2, Math.min(yOpen, yClose), candleWidth, Math.max(2, Math.abs(yClose - yOpen)));

      // Señales BUY/SELL
      if (v.signal) {
        ctx.fillStyle = v.signal.type === "BUY" ? "#22c55e" : "#ef4444";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(v.signal.type === "BUY" ? "🚀 BUY" : "🪂 SELL", x - 15, v.signal.type === "BUY" ? yLow + 18 : yHigh - 10);
      }
    });

    // C. MEDIAS MÓVILES
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = 2; ctx.beginPath();
    let firstMAShort = true;
    visibleData.forEach((v, i) => {
      if (v.shortMA) { const x = getX(i), y = getY(v.shortMA); if (firstMAShort) { ctx.moveTo(x, y); firstMAShort = false; } else ctx.lineTo(x, y); }
    });
    ctx.stroke();

    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2; ctx.beginPath();
    let firstMALong = true;
    visibleData.forEach((v, i) => {
      if (v.longMA) { const x = getX(i), y = getY(v.longMA); if (firstMALong) { ctx.moveTo(x, y); firstMALong = false; } else ctx.lineTo(x, y); }
    });
    ctx.stroke();

    // D. PRECIO ACTUAL EN TIEMPO REAL (ETIQUETA DERECHA)
    const lastVelaActual = visibleData[visibleData.length - 1];
    if (viewOffset === 0 && lastVelaActual) {
        const yActual = getY(lastVelaActual.close);
        ctx.fillStyle = lastVelaActual.close >= lastVelaActual.open ? "#22c55e" : "#ef4444";
        ctx.fillRect(canvas.width - padding - 40, yActual - 8, 40, 16);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 10px monospace";
        ctx.fillText(lastVelaActual.close.toFixed(2), canvas.width - padding - 35, yActual + 4);
    }
  }

  function updateCFD(){ 
    cfdData.push(generarVela()); 
    if(cfdData.length > 500) cfdData.shift(); // Buffer histórico
    analizarPineScriptEngine();
    drawCFD(); 
  }

  function startLoop(speed) {
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(updateCFD, speed);
  }

  window.cambiarTimeframe = function(newSpeed) {
    currentSpeed = parseInt(newSpeed);
    startLoop(currentSpeed);
    logConsole("SISTEMA", `Velocidad actualizada a ${currentSpeed / 1000}s por vela.`);
  };

  window.inyectarNoticia = function(tipo) {
    if (tipo === 'NFP') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 0.8);
      logConsole("NOTICIA MACRO", "💥 Shock NFP EE.UU. inyectando volatilidad instantánea.");
    } else if (tipo === 'BCE') {
      shockVolatilidad = (Math.random() > 0.5 ? 1 : -1) * (1.0 + Math.random() * 0.5);
      logConsole("NOTICIA MACRO", "🏛️ Shock BCE: Movimiento brusco detectado por decisión de tasas.");
    }
  };

  initCFD();
  startLoop(currentSpeed);

  // 6. CONSOLA IA COPILOT (EN VIVO CONECTADA AL GRAFICO)
  const iaConsole = document.getElementById("ia-console");
  let chatHistory = [];

  function logConsole(source, text){
    if (!iaConsole) return;
    const timestamp = new Date().toLocaleTimeString();
    chatHistory.push(`[${timestamp}] [${source}] ${text}`);
    iaConsole.innerText = chatHistory.slice(-40).join("\n\n");
    iaConsole.scrollTop = iaConsole.scrollHeight;
  }

  window.sendMessage = function(){
    const input = document.getElementById("chat-input");
    if (!input) return;
    const msg = input.value.trim();
    if(!msg) return;
    input.value = "";
    logConsole("USER", msg);
    processMessage(msg);
  };

  function processMessage(msg){
    const cleanMsg = msg.toLowerCase();
    const lastVela = cfdData[cfdData.length - 1];
    let response = "";

    // Respuestas en vivo basadas en datos reales del gráfico
    if (cleanMsg.includes("tendencia") || cleanMsg.includes("trend") || cleanMsg.includes("que hago")) {
      const mov = lastVela.shortMA > lastVela.longMA ? "🔴 ALCISTA" : "🟢 BAJISTA";
      response = `ANÁLISIS DE TENDENCIA (SMA 20/50):\n ├─ Estado actual: ${mov}\n └─ Precio actual: ${lastVela.close.toFixed(2)}`;
    }
    else if (cleanMsg.includes("rsi")) {
      const rsiVal = lastVela.rsi ? lastVela.rsi.toFixed(1) : "50.0";
      const estado = rsiVal > 70 ? "🔴 SOBRECOMPRA" : rsiVal < 30 ? "🟢 SOBREVENTA" : "🟡 NEUTRO";
      response = `INDICADOR RSI (14):\n ├─ Valor actual: ${rsiVal}\n └─ Diagnóstico: ${estado}`;
    }
    else if (cleanMsg.includes("precio") || cleanMsg.includes("direction")) {
      const movVela = lastVela.close >= lastVela.open ? "Subiendo" : "Bajando";
      response = `COPILOT LIVE:\n ├─ Precio EUR/USD: ${lastVela.close.toFixed(2)}\n ├─ Última vela: ${movVela}\n └─ Volumen simulado estable.`;
    }
    else {
      response = `COPILOT IA: Comando analizado ("${msg}"). Motor PineScript activo monitoreando cruce de medias y RSI. Balance estable.`;
    }

    setTimeout(() => logConsole("COPILOT IA", response), 200);
  }

  function showAlert(msg, typeClass = "alert-info"){
    const box = document.getElementById("alertBox");
    if (!box) return;
    const div = document.createElement("div");
    div.className = `alert ${typeClass}`;
    div.innerText = msg;
    box.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  logConsole("SISTEMA", "Bloomberg Terminal Pro v6.0 Ready.\nEje de precio lateral visible, Zoom con rueda del ratón, Pan con arrastre.");
});
</script>
</body>
</html>
