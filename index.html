<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bloomberg Pro – PineScript AI Strategy Engine</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#0b0e14; color:#fff; display:flex; flex-wrap:wrap; gap:10px; padding:10px; justify-content:center;}
  .panel { border:1px solid #2a2e39; border-radius:8px; background:#131722; padding:10px; flex:1 1 45%; min-width:320px; display:flex; flex-direction:column; height:460px;}
  h2 { margin:0 0 8px 0; text-align:center; font-size:0.95rem; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .text-euro { color: #3b82f6; }
  .text-dolar { color: #ef4444; }
  .tradingview-widget-container { flex:1; margin-top:3px; border-radius:4px; overflow:hidden; min-height: 60px; }
  
  .header-cfd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .timeframe-select { background: #1e222d; color: #3b82f6; border: 1px solid #2a2e39; border-radius: 4px; padding: 2px 8px; font-weight: bold; cursor: pointer; }

  #cfd-container { flex:1; border:1px solid #2a2e39; border-radius:6px; position:relative; background:#000; overflow:hidden; }
  #cfd-canvas { width:100%; height:100%; display:block; }
  
  #ia-news-container { display:flex; gap:10px; height:160px; margin-top:8px; }
  #ia-console { flex:1.3; background:#05070a; color:#00ff66; font-family:'Courier New', Courier, monospace; padding:8px; overflow-y:auto; font-size:0.75rem; border-radius:4px; border:1px solid #2a2e39; line-height: 1.4; }
  .news-panel { flex:1; background:#131722; padding:8px; border-radius:4px; border:1px solid #2a2e39; display:flex; flex-direction:column; }
  .news-panel h3 { margin:0 0 5px 0; font-size:12px; color:#8f9cae; text-transform:uppercase; }
  
  .input-group { display:flex; gap:6px; margin-top:auto; }
  input[type="text"] { flex:1; padding:8px; border-radius:4px; border:1px solid #2a2e39; background:#1e222d; color:#fff; font-size:0.8rem; outline:none; }
  input[type="text"]:focus { border-color: #2563eb; }
  button { padding:8px 14px; border-radius:4px; border:none; background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; font-size:0.8rem; transition: background 0.2s; }
  button:hover { background:#1d4ed8; }
  
  #alertBox { position:absolute; top:10px; right:10px; z-index:10; display:flex; flex-direction:column; gap:6px; }
  .alert { padding:8px 12px; font-size:0.75rem; font-weight:bold; border-radius:4px; box-shadow:0 4px 6px rgba(0,0,0,0.6); animation: fadeIn 0.3s forwards; }
  .alert-buy { background:#16a34a; color:#fff; border-left:4px solid #4ade80; }
  .alert-sell { background:#dc2626; color:#fff; border-left:4px solid #f87171; }
  .alert-info { background:#2563eb; color:#fff; border-left:4px solid #60a5fa; }
  
  @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- PANEL EQUIPO EURO -->
<div class="panel">
  <h2 class="text-euro">🇪🇺 Bloque Euro (Fuerza Eurozona)</h2>
  <div class="tradingview-widget-container" id="tv_exy"></div>
  <div class="tradingview-widget-container" id="tv_eurodolar"></div>
  <div class="tradingview-widget-container" id="tv_bono_eu"></div>
  <div class="tradingview-widget-container" id="tv_eurjpy"></div>
  <div class="tradingview-widget-container" id="tv_dax"></div>
</div>

<!-- PANEL EQUIPO DÓLAR -->
<div class="panel">
  <h2 class="text-dolar">🇺🇸 Bloque Dólar (Fuerza USD / Inflación)</h2>
  <div class="tradingview-widget-container" id="tv_dxy"></div>
  <div class="tradingview-widget-container" id="tv_bono_us"></div>
  <div class="tradingview-widget-container" id="tv_brent"></div>
  <div class="tradingview-widget-container" id="tv_sp500"></div>
  <div class="tradingview-widget-container" id="tv_vix"></div>
</div>

<!-- PANEL CFD SINTÉTICO & MOTOR PINE SCRIPT AI -->
<div class="panel" style="flex:1 1 95%; height: 520px;">
  <div class="header-cfd">
    <h2>📊 CFD Sintético Real-Time – Engine Pine Script v5 (SMA + Fib + ATR + Patrones)</h2>
    <div>
      <label style="font-size: 0.75rem; color:#8f9cae;">Escala: </label>
      <select id="tf-select" class="timeframe-select" onchange="window.cambiarTimeframe(this.value)">
        <option value="1000">M1 (1s)</option>
        <option value="3000" selected>M5 (3s)</option>
        <option value="5000">M15 (5s)</option>
        <option value="10000">H1 (10s)</option>
      </select>
    </div>
  </div>
  
  <div id="cfd-container">
    <div id="alertBox"></div>
    <canvas id="cfd-canvas"></canvas>
  </div>
  
  <div id="ia-news-container">
    <div id="ia-console"></div>
    <div class="news-panel">
      <h3>Terminal Copilot IA Macro & Técnico</h3>
      <p style="font-size:0.75rem; color:#8f9cae; margin:0 0 8px 0;">Haz consultas sobre la tendencia, Fibonacci, Medias Móviles o envía noticias de impacto.</p>
      <div class="input-group">
        <input type="text" id="chat-input" placeholder="Ej: ¿Qué tendencia tenemos?, Analizar Fibonacci, Compra..." onkeypress="if(event.key==='Enter') window.sendMessage()">
        <button onclick="window.sendMessage()">Analizar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // ==========================================
  // 1. INTEGRACIÓN DE WIDGETS DE TRADINGVIEW (SIMBOLOS COMPATIBLES)
  // ==========================================
  function crearWidget(containerId, symbol){
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    if (typeof TradingView !== 'undefined') {
      new TradingView.widget({
        container_id: containerId,
        symbol: symbol,
        interval: "15",
        timezone: "Europe/Madrid",
        theme: "dark",
        style: "1",
        locale: "es",
        hide_top_toolbar: true,
        hide_legend: true,
        width: "100%",
        height: "100%"
      });
    }
  }

  // Tickers globales universales
  const widgets = {
    // Bloque Euro
    tv_exy:        "FX_IDC:EURUSD", 
    tv_eurodolar:  "FX:EURUSD",     
    tv_bono_eu:    "TICKERS:DE10Y", 
    tv_eurjpy:     "FX:EURJPY",     
    tv_dax:        "GLOBALDATA:DAX", 
    // Bloque Dólar
    tv_dxy:        "CAPITALCOM:DXY", 
    tv_bono_us:    "TVC:US10Y",     
    tv_brent:      "TVC:UKOIL",     
    tv_sp500:      "FOREXCOM:SPXUSD",
    tv_vix:        "TVC:VIX"  
  };

  for(const id in widgets) {
    crearWidget(id, widgets[id]);
  }

  // ==========================================
  // 2. MOTOR DE SIMULACIÓN Y ESTRUCTURA CFD
  // ==========================================
  let cfdData = [];
  let lastClose = 100.00;
  let updateInterval = null;
  let currentSpeed = 3000;

  const canvas = document.getElementById("cfd-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){ 
    canvas.width = canvas.parentElement.clientWidth; 
    canvas.height = canvas.parentElement.clientHeight; 
  }
  window.addEventListener("resize", () => { resizeCanvas(); drawCFD(); });
  resizeCanvas();

  const pesosEuro = { tv_exy: 0.30, tv_eurodolar: 0.25, tv_bono_eu: 0.20, tv_eurjpy: 0.15, tv_dax: 0.10 };
  const pesosDolar = { tv_dxy: 0.30, tv_bono_us: 0.25, tv_brent: 0.20, tv_sp500: 0.15, tv_vix: 0.10 };

  function obtenerCambioPorcentual(pesos) {
    let cambioTotal = 0;
    for (const id in pesos) {
      const pctChange = (Math.random() - 0.492) * 0.18;
      cambioTotal += pctChange * pesos[id];
    }
    return cambioTotal;
  }

  function calcularNuevoPrecioCFD() {
    const euroPerf = obtenerCambioPorcentual(pesosEuro);
    const dolarPerf = obtenerCambioPorcentual(pesosDolar);
    const netDelta = euroPerf - dolarPerf;
    return lastClose * (1 + netDelta / 100);
  }

  // ==========================================
  // 3. ESTRUCTURA PINE SCRIPT V5 EN JAVASCRIPT
  // ==========================================
  const LONG_MA_LEN = 50;  
  const SHORT_MA_LEN = 20; 
  const ATR_TARGET_MULT = 1.5;
  const ATR_STOP_MULT = 1.0;

  function ta_sma(data, length) {
    if (data.length < length) return null;
    const slice = data.slice(-length);
    const sum = slice.reduce((acc, val) => acc + val.close, 0);
    return sum / length;
  }

  function ta_atr(data, length = 14) {
    if (data.length < length + 1) return 0.2;
    let trSum = 0;
    for (let i = data.length - length; i < data.length; i++) {
      const high = data[i].high;
      const low = data[i].low;
      const prevClose = data[i - 1].close;
      const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
      trSum += tr;
    }
    return trSum / length;
  }

  let memoryLastSuccessPrice = null;
  let memoryLastClosedSignal = null;

  function analizarPineScriptEngine() {
    if (cfdData.length < 5) return; // Permite dibujado desde velas tempranas

    const currentIdx = cfdData.length - 1;
    const currentCandle = cfdData[currentIdx];

    const shortMA = ta_sma(cfdData, SHORT_MA_LEN);
    const longMA = ta_sma(cfdData, LONG_MA_LEN);

    const prevShortMA = ta_sma(cfdData.slice(0, -1), SHORT_MA_LEN);
    const prevLongMA = ta_sma(cfdData.slice(0, -1), LONG_MA_LEN);

    const buySignal = prevShortMA && prevLongMA && (prevShortMA <= prevLongMA) && (shortMA > longMA);
    const sellSignal = prevShortMA && prevLongMA && (prevShortMA >= prevLongMA) && (longMA > shortMA);

    const open = currentCandle.open;
    const close = currentCandle.close;
    const high = currentCandle.high;
    const low = currentCandle.low;
    const body = Math.abs(open - close);
    const range = Math.max(0.001, high - low);

    const isHammer = ((high - Math.max(open, close)) > 2 * body) && ((Math.min(open, close) - low) > 2 * body);
    const isDoji = body <= 0.1 * range;

    const slice50 = cfdData.slice(-50);
    const fibHigh = Math.max(...slice50.map(v => v.high));
    const fibLow = Math.min(...slice50.map(v => v.low));
    const fibRange = fibHigh - fibLow;
    const fib50 = fibLow + 0.5 * fibRange;
    const fib618 = fibLow + 0.618 * fibRange;

    const atr = ta_atr(cfdData, 14);
    const profitTarget = atr * ATR_TARGET_MULT;
    const stopLoss = atr * ATR_STOP_MULT;

    currentCandle.shortMA = shortMA;
    currentCandle.longMA = longMA;
    currentCandle.fib50 = fib50;
    currentCandle.fib618 = fib618;
    currentCandle.isHammer = isHammer;
    currentCandle.isDoji = isDoji;

    if (buySignal) {
      const target = close + profitTarget;
      const stop = close - stopLoss;
      currentCandle.signal = { type: "BUY", target, stop };
      showAlert(`COMPRA 🚀 @ ${close.toFixed(2)} | Target: ${target.toFixed(2)} | Stop: ${stop.toFixed(2)}`, "alert-buy");
      logConsole("PINE ENGINE", `🚀 SEÑAL DE COMPRA (Cruce SMA 20/50)\n ├─ Entrada: ${close.toFixed(2)}\n ├─ Take Profit: ${target.toFixed(2)} (+${profitTarget.toFixed(2)})\n └─ Stop Loss: ${stop.toFixed(2)} (-${stopLoss.toFixed(2)})`);
      memoryLastClosedSignal = "BUY";
      memoryLastSuccessPrice = close;
    } else if (sellSignal) {
      const target = close - profitTarget;
      const stop = close + stopLoss;
      currentCandle.signal = { type: "SELL", target, stop };
      showAlert(`VENTA 🪂 @ ${close.toFixed(2)} | Target: ${target.toFixed(2)} | Stop: ${stop.toFixed(2)}`, "alert-sell");
      logConsole("PINE ENGINE", `🪂 SEÑAL DE VENTA (Cruce SMA 20/50)\n ├─ Entrada: ${close.toFixed(2)}\n ├─ Take Profit: ${target.toFixed(2)} (-${profitTarget.toFixed(2)})\n └─ Stop Loss: ${stop.toFixed(2)} (+${stopLoss.toFixed(2)})`);
      memoryLastClosedSignal = "SELL";
      memoryLastSuccessPrice = close;
    }
  }

  // ==========================================
  // 4. DIBUJO DEL CANVAS (VELAS, SMA, FIB)
  // ==========================================
  function generarVela(){ 
    const open = lastClose; 
    const close = calcularNuevoPrecioCFD(); 
    const high = Math.max(open, close) + Math.random() * 0.08; 
    const low = Math.min(open, close) - Math.random() * 0.08; 
    lastClose = close; 
    return { open, high, low, close };
  }

  function initCFD(){ 
    cfdData = [];
    for(let i = 0; i < 60; i++){ 
      cfdData.push(generarVela()); 
      analizarPineScriptEngine();
    }
    drawCFD();
  }

  function drawCFD(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(cfdData.length === 0) return;

    const padding = 45;
    const width = canvas.width - padding * 2;
    const height = canvas.height - padding * 2;

    const max = Math.max(...cfdData.map(v => v.high)) + 0.05;
    const min = Math.min(...cfdData.map(v => v.low)) - 0.05;

    const getX = (i) => padding + (i / (cfdData.length - 1 || 1)) * width;
    const getY = (val) => padding + (max - val) / Math.max(0.001, (max - min)) * height;

    const lastCandle = cfdData[cfdData.length - 1];
    if (lastCandle && lastCandle.fib50) {
      ctx.strokeStyle = "rgba(34, 197, 94, 0.4)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(padding, getY(lastCandle.fib50)); ctx.lineTo(canvas.width - padding, getY(lastCandle.fib50)); ctx.stroke();
      ctx.fillStyle = "#22c55e"; ctx.font = "10px sans-serif";
      ctx.fillText(`Fib 50.0%: ${lastCandle.fib50.toFixed(2)}`, canvas.width - 110, getY(lastCandle.fib50) - 3);

      ctx.strokeStyle = "rgba(239, 68, 68, 0.4)";
      ctx.beginPath(); ctx.moveTo(padding, getY(lastCandle.fib618)); ctx.lineTo(canvas.width - padding, getY(lastCandle.fib618)); ctx.stroke();
      ctx.fillStyle = "#ef4444";
      ctx.fillText(`Fib 61.8%: ${lastCandle.fib618.toFixed(2)}`, canvas.width - 110, getY(lastCandle.fib618) - 3);
      ctx.setLineDash([]);
    }

    const candleWidth = Math.max(3, (width / cfdData.length) - 3);

    cfdData.forEach((v, i) => {
      const x = getX(i);
      const yOpen = getY(v.open);
      const yClose = getY(v.close);
      const yHigh = getY(v.high);
      const yLow = getY(v.low);

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();

      ctx.fillStyle = (v.close >= v.open) ? "#22c55e" : "#ef4444";
      ctx.fillRect(x - candleWidth/2, Math.min(yOpen, yClose), candleWidth, Math.max(2, Math.abs(yClose - yOpen)));

      if (v.isHammer) {
        ctx.fillStyle = "#a855f7"; ctx.font = "10px sans-serif";
        ctx.fillText("🔨", x - 5, yLow + 12);
      }
      if (v.isDoji) {
        ctx.fillStyle = "#eab308"; ctx.font = "10px sans-serif";
        ctx.fillText("✖", x - 4, yHigh - 5);
      }

      if (v.signal) {
        if (v.signal.type === "BUY") {
          ctx.fillStyle = "#22c55e"; ctx.font = "12px sans-serif";
          ctx.fillText("🚀 Compra", x - 20, yLow + 22);
        } else if (v.signal.type === "SELL") {
          ctx.fillStyle = "#ef4444"; ctx.font = "12px sans-serif";
          ctx.fillText("🪂 Venta", x - 18, yHigh - 12);
        }
      }
    });

    // Medias Móviles
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = 2; ctx.beginPath();
    let first20 = true;
    cfdData.forEach((v, i) => {
      if (v.shortMA) {
        const x = getX(i); const y = getY(v.shortMA);
        if (first20) { ctx.moveTo(x, y); first20 = false; } else { ctx.lineTo(x, y); }
      }
    });
    ctx.stroke();

    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2; ctx.beginPath();
    let first50 = true;
    cfdData.forEach((v, i) => {
      if (v.longMA) {
        const x = getX(i); const y = getY(v.longMA);
        if (first50) { ctx.moveTo(x, y); first50 = false; } else { ctx.lineTo(x, y); }
      }
    });
    ctx.stroke();

    ctx.fillStyle = "#64748b"; ctx.font = "11px monospace";
    ctx.fillText(max.toFixed(2), 5, padding);
    ctx.fillText(min.toFixed(2), 5, canvas.height - padding);
  }

  function updateCFD(){ 
    cfdData.push(generarVela()); 
    if(cfdData.length > 70) cfdData.shift(); 
    analizarPineScriptEngine();
    drawCFD(); 
  }

  function startLoop(speed) {
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(updateCFD, speed);
  }

  window.cambiarTimeframe = function(newSpeed) {
    currentSpeed = parseInt(newSpeed);
    startLoop(currentSpeed);
    logConsole("SISTEMA", `Escala cambiada a ${currentSpeed / 1000}s por vela.`);
  };

  initCFD();
  startLoop(currentSpeed);

  // ==========================================
  // 5. CONSOLA IA SMART COPILOT Y COMANDOS (EXPOSICIÓN GLOBAL)
  // ==========================================
  const iaConsole = document.getElementById("ia-console");
  let chatHistory = [];

  function logConsole(source, text){
    if (!iaConsole) return;
    const timestamp = new Date().toLocaleTimeString();
    const newLine = `[${timestamp}] [${source}] ${text}`;
    chatHistory.push(newLine);
    iaConsole.innerText = chatHistory.slice(-40).join("\n\n");
    iaConsole.scrollTop = iaConsole.scrollHeight;
  }

  window.sendMessage = function(){
    const input = document.getElementById("chat-input");
    if (!input) return;
    const msg = input.value.trim();
    if(!msg) return;
    input.value = "";
    logConsole("USER", msg);
    processMessage(msg);
  };

  function processMessage(msg){
    const cleanMsg = msg.toLowerCase();
    let response = "";

    const lastCandle = cfdData[cfdData.length - 1];
    const shortMA = (lastCandle && lastCandle.shortMA) ? lastCandle.shortMA.toFixed(2) : "Calculando...";
    const longMA = (lastCandle && lastCandle.longMA) ? lastCandle.longMA.toFixed(2) : "Calculando...";

    if (cleanMsg.includes("tendencia") || cleanMsg.includes("ma") || cleanMsg.includes("media")) {
      const estadoMA = (lastCandle && lastCandle.shortMA > lastCandle.longMA) ? "📈 ALCISTA (SMA 20 > SMA 50)" : "📉 BAJISTA (SMA 20 < SMA 50)";
      response = `ANÁLISIS DE TENDENCIA:\n ├─ Estado actual: ${estadoMA}\n ├─ SMA 20 (Corta): ${shortMA}\n └─ SMA 50 (Larga): ${longMA}`;
    } 
    else if (cleanMsg.includes("fibonacci") || cleanMsg.includes("fib")) {
      response = (lastCandle && lastCandle.fib50) 
        ? `ANÁLISIS DE FIBONACCI:\n ├─ Nivel 50.0%: ${lastCandle.fib50.toFixed(2)}\n └─ Nivel 61.8% (Golden Zone): ${lastCandle.fib618.toFixed(2)}`
        : "Recopilando datos suficientes para calcular Fibonacci...";
    }
    else if (cleanMsg.includes("precio") || cleanMsg.includes("cfd") || cleanMsg.includes("cotizacion")) {
      response = `COTIZACIÓN EN TIEMPO REAL:\n ├─ Precio Actual: ${lastClose.toFixed(2)}\n └─ Última vela procesada dinámicamente.`;
    }
    else if (cleanMsg.includes("memoria") || cleanMsg.includes("historico")) {
      response = memoryLastClosedSignal 
        ? `MEMORIA DE ESTRATEGIA:\n ├─ Última señal cerrada: ${memoryLastClosedSignal}\n └─ Precio de entrada registrado: ${memoryLastSuccessPrice.toFixed(2)}`
        : "MEMORIA DE ESTRATEGIA:\n └─ Esperando cruces de medias para registrar órdenes.";
    }
    else {
      response = `IA COPILOT: Consulta analizada ("${msg}"). Evaluando volatilidad entre bloques Euro/Dólar. Las Medias Móviles avanzan según el intervalo activo.`;
    }

    setTimeout(() => logConsole("IA CORE", response), 200);
  }

  function showAlert(msg, typeClass = "alert-info"){
    const box = document.getElementById("alertBox");
    if (!box) return;
    const div = document.createElement("div");
    div.className = `alert ${typeClass}`;
    div.innerText = msg;
    box.appendChild(div);
    setTimeout(() => div.remove(), 5000);
  }

  logConsole("SISTEMA", "Mini Bloomberg Pro activo.\nEngine Pine Script v5 cargado (SMA, Fib, ATR).");
});
</script>
</body>
</html>
